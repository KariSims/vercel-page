services:
  kumpax-landing:
    build:
      context: .
      # VITE_WEB3FORMS_ACCESS_KEY doit être embarquée dans le bundle JS au
      # moment du build (Vite l'inline à la compilation, pas au runtime) —
      # docker compose lit .env à la racine pour résoudre cette variable
      # avant de la passer en build arg au Dockerfile.
      args:
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY}
    image: kumpax-landing:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Derrière un reverse proxy (Traefik, nginx, Coolify...), retire le
    # mapping de port ci-dessus et route le trafic vers le port interne 80.
